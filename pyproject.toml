[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonora"
version = "0.1.0"
description = "CLI tool for FLAC/MP3 music tagging, library checking, and file organization"
readme = "README.md"
authors = [
    { name = "Daniel Radu" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["audio", "flac", "metadata", "musicbrainz", "acoustid", "replaygain", "bpm", "lyrics", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "pytaglib>=2.1.0",
    "orjson>=3.9.0",
    "mutagen>=1.46.0",
    "musicbrainzngs>=0.7.1",
    "pyacoustid>=1.2.2",
    "syncedlyrics>=0.7.0",
    "rich>=13.7.0",
    "diskcache>=5.6.3",
    "python-dotenv>=1.0.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "rapidfuzz>=3.0.0",
    "pillow>=9.0.0",
    "httpx[http2]>=0.27.0",
    "ftfy>=6.2.0",
    "music-metadata-filter>=3.0.0",
    "imagehash>=4.3.0",
    "pyloudnorm>=0.2.0",
    "pathvalidate>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
sonora = "sonora.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonora = ["py.typed"]

[tool.mypy]
ignore_missing_imports = true
