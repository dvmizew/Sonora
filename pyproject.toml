[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonora"
version = "2.0.0"
description = "CLI tool for FLAC/MP3 music tagging, library checking, and file organization"
readme = "README.md"
authors = [
    { name = "Daniel Radu" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["audio", "flac", "metadata", "musicbrainz", "acoustid", "replaygain", "bpm", "lyrics", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "pytaglib>=3.2.0",
    "orjson>=3.9.0",
    "ijson>=3.4.0",
    "mutagen>=1.46.0",
    "musicbrainzngs>=0.7.1",
    "pyacoustid>=1.2.2",
    "syncedlyrics>=0.7.0",
    "rich>=13.7.0",
    "diskcache>=5.6.3",
    "filelock>=3.13",
    "msgpack>=1.1.2",
    "platformdirs>=4.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.10.0",
    "numpy>=1.23.5",
    "soundfile>=0.12.0",
    "rapidfuzz>=3.0.0",
    "pillow>=9.0.0",
    "httpx[http2]>=0.27.0",
    "aiohttp>=3.8.0",
    "ftfy>=6.2.0",
    "music-metadata-filter>=3.0.0",
    "pyloudnorm>=0.2.0",
    "pathvalidate>=3.2.0",
    "cyclopts>=4.0.0",
    "anyascii>=0.3.2",
    "tomli>=1.1.0; python_version < '3.11'",
    "pycountry>=24.0.0",
    "shazamio @ git+https://github.com/shazamio/ShazamIO.git@8afb07c0ff31c663daa895ebc1d5db17a74fc4ed",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.10.0",
    "typing_extensions>=4.4.0",
    "mypy>=1.10.0",
    "pyright>=1.1.411",
    "bandit>=1.7.9",
    "ruff>=0.1.0",
]

[dependency-groups]
build = ["pyinstaller==6.21.0", "setuptools==80.10.2"]

[tool.uv]
required-version = "==0.13.0"
build-constraint-dependencies = ["setuptools==80.10.2"]

[project.scripts]
sonora = "sonora.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonora = ["py.typed", "defaults.json"]

[tool.mypy]
ignore_missing_imports = true
mypy_path = "typings"
# Mutagen's public constructors are unannotated; Sonora's own calls remain strict.
untyped_calls_exclude = ["mutagen"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
stubPath = "typings"

[tool.coverage.run]
branch = true
source_pkgs = ["sonora"]
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = []
partial_branches = []
