name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, "feature/*" ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libtag1-dev ffmpeg flac sox libchromaprint-dev libchromaprint-tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint & type check
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/
          mypy --strict src/ tests/
          python -m pyflakes src/ tests/
          pyright

      - name: Security scan
        run: |
          bandit -r src/ -s B404,B603,B310

      - name: Run regression tests with coverage
        run: |
          python -W error -m coverage run -m unittest discover -s tests
          python -m coverage report

      - name: Generate coverage reports
        run: |
          python -m coverage html
          python -m coverage xml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python }}
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: error

      - name: Smoke test CLI
        run: |
          sonora
