name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, "feature/*" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libtag1-dev ffmpeg flac sox chromaprint

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyflakes mypy bandit
          pip install .

      - name: Lint & type check
        run: |
          ruff check src/ tests/
          pyflakes src/ tests/
          mypy src/ tests/

      - name: Security scan
        run: |
          bandit -r src/ -s B404,B603,B310

      - name: Run tests
        run: |
          python -m unittest discover -s tests

      - name: Smoke test CLI
        run: |
          sonora
