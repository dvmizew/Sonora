name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Executable
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            asset_name: sonora-linux-x86_64
          - os: windows-latest
            asset_name: sonora-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libtag1-dev ffmpeg flac sox libchromaprint-dev libchromaprint-tools

      - name: Build binary with PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .
          pyinstaller --onefile \
            --name ${{ matrix.asset_name }} \
            --collect-all soundfile \
            --collect-all taglib \
            --collect-all scipy \
            --collect-all rich \
            src/sonora/cli/main.py

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
